name: Open paired backport PR

# Fires when a `backport <target-branch>` label is added to a PR.
# Opens the paired backport PR *immediately* (not after merge) so both
# PRs' CIs run in parallel — solves the "sequential = slow" concern.
#
# Uses `pull_request_target` so the workflow definition + secrets come
# from the base branch, not the PR head — safe against PR injection.

on:
  pull_request_target:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    if: startsWith(github.event.label.name, 'backport ')
    runs-on: ubuntu-latest
    env:
      SOURCE_PR: ${{ github.event.pull_request.number }}
      SOURCE_TITLE: ${{ github.event.pull_request.title }}
      SOURCE_AUTHOR: ${{ github.event.pull_request.user.login }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      LABEL_NAME: ${{ github.event.label.name }}
      # BOT_TOKEN is a PAT (or App-installation token) — required so the branch
      # push and PR creation trigger downstream workflows. GITHUB_TOKEN-authored
      # events do NOT trigger workflows (documented GitHub Actions limitation).
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Extract target branch from label
        id: target
        run: |
          TARGET="${LABEL_NAME#backport }"
          SANITIZED="${TARGET//\//-}"
          BRANCH="backport/${SOURCE_PR}-to-${SANITIZED}"
          {
            echo "target=${TARGET}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out target branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source PR head
        run: git fetch origin "${SOURCE_HEAD_SHA}"

      - name: Create backport branch and cherry-pick
        id: cherry
        run: |
          git switch -c "${{ steps.target.outputs.branch }}"
          set +e
          git cherry-pick "${SOURCE_BASE_SHA}..${SOURCE_HEAD_SHA}"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            # Commit conflict markers as-is so the developer can push fixes.
            git add -A
            GIT_EDITOR=true git cherry-pick --continue 2>/dev/null \
              || git commit --no-verify --allow-empty \
                   -m "Backport WIP: cherry-pick had conflicts — resolve markers in this branch"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push backport branch
        run: git push origin "${{ steps.target.outputs.branch }}"

      - name: Open backport PR + cross-link
        env:
          TARGET: ${{ steps.target.outputs.target }}
          BRANCH: ${{ steps.target.outputs.branch }}
          CONFLICT: ${{ steps.cherry.outputs.conflict }}
        run: |
          {
            echo "Automated backport of #${SOURCE_PR} into \`${TARGET}\`."
            echo
            echo "**Paired PR:** #${SOURCE_PR}"
            echo
            echo "<!-- paired-pr: ${SOURCE_PR} -->"
            echo
            echo "Original author: @${SOURCE_AUTHOR}"
            echo
            if [ "$CONFLICT" = "true" ]; then
              echo "⚠️ **Cherry-pick had conflicts.** The branch was pushed with unresolved markers. Pull the branch, fix them, push. CI will re-run."
              echo
            fi
            echo "This PR must pass its own \`ci\` **and** the paired PR's \`partner-ci\` before it can merge."
          } > /tmp/body.md

          URL=$(gh pr create \
            --base "$TARGET" \
            --head "$BRANCH" \
            --title "[Backport ${TARGET}] ${SOURCE_TITLE}" \
            --body-file /tmp/body.md)
          BACKPORT_PR="${URL##*/}"

          # Cross-link on the source PR so mutual-gate can find the pair.
          {
            echo "🔗 Paired backport PR opened: #${BACKPORT_PR}"
            echo
            echo "<!-- paired-pr: ${BACKPORT_PR} -->"
          } > /tmp/comment.md
          gh pr comment "$SOURCE_PR" --body-file /tmp/comment.md
