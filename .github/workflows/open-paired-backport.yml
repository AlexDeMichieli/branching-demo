name: Open paired backport PR

# Fires the moment a PR is opened against main. Automatically opens a paired
# backport PR against TARGET_BRANCH so both PRs' CIs run in parallel.
#
# No label needed. If a PR shouldn't be backported, close the auto-opened
# backport PR — the mutual gate then only requires ci on the source PR.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  open:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      !startsWith(github.event.pull_request.head.ref, 'backport/')
    runs-on: ubuntu-latest
    env:
      # Change this (or wire it to a repo variable) for repos with a different
      # maintenance-branch name. Only one target at a time; loop or matrix
      # if you need multiple.
      TARGET_BRANCH: release/2026.q3
      SOURCE_PR: ${{ github.event.pull_request.number }}
      SOURCE_TITLE: ${{ github.event.pull_request.title }}
      SOURCE_AUTHOR: ${{ github.event.pull_request.user.login }}
      SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      SOURCE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Compute backport branch name
        id: target
        run: |
          SANITIZED="${TARGET_BRANCH//\//-}"
          BRANCH="backport/${SOURCE_PR}-to-${SANITIZED}"
          {
            echo "target=${TARGET_BRANCH}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

      - name: Check out target branch (full history)
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.target }}
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch source PR head
        run: git fetch origin "${SOURCE_HEAD_SHA}"

      - name: Create backport branch and cherry-pick
        id: cherry
        run: |
          git switch -c "${{ steps.target.outputs.branch }}"
          set +e
          git cherry-pick "${SOURCE_BASE_SHA}..${SOURCE_HEAD_SHA}"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            git add -A
            GIT_EDITOR=true git cherry-pick --continue 2>/dev/null \
              || git commit --no-verify --allow-empty \
                   -m "Backport WIP: cherry-pick had conflicts — resolve markers in this branch"
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push backport branch
        run: git push origin "${{ steps.target.outputs.branch }}"

      - name: Open backport PR + cross-link
        env:
          TARGET: ${{ steps.target.outputs.target }}
          BRANCH: ${{ steps.target.outputs.branch }}
          CONFLICT: ${{ steps.cherry.outputs.conflict }}
        run: |
          {
            echo "Automated backport of #${SOURCE_PR} into \`${TARGET}\`."
            echo
            echo "**Paired PR:** #${SOURCE_PR}"
            echo
            echo "<!-- paired-pr: ${SOURCE_PR} -->"
            echo
            echo "Original author: @${SOURCE_AUTHOR}"
            echo
            if [ "$CONFLICT" = "true" ]; then
              echo "⚠️ **Cherry-pick had conflicts.** The branch was pushed with unresolved markers. Pull the branch, fix them, push. CI will re-run."
              echo
            fi
            echo "This PR must pass its own \`ci\` **and** the paired PR's \`partner-ci\` before it can merge."
            echo
            echo "If this backport isn't needed, just close this PR — the source PR then only needs its own \`ci\`."
          } > /tmp/body.md

          URL=$(gh pr create \
            --base "$TARGET" \
            --head "$BRANCH" \
            --title "[Backport ${TARGET}] ${SOURCE_TITLE}" \
            --body-file /tmp/body.md)
          BACKPORT_PR="${URL##*/}"

          {
            echo "🔗 Paired backport PR opened automatically: #${BACKPORT_PR}"
            echo
            echo "If this change should NOT be backported to \`${TARGET}\`, close the paired PR."
            echo
            echo "<!-- paired-pr: ${BACKPORT_PR} -->"
          } > /tmp/comment.md
          gh pr comment "$SOURCE_PR" --body-file /tmp/comment.md

      - name: Re-run ci on source PR so it picks up the paired-pr marker
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          RUN_ID=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow ci.yml \
            --branch "$SOURCE_BRANCH" \
            --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          if [ -n "$RUN_ID" ]; then
            gh run rerun "$RUN_ID" --repo "${{ github.repository }}"
          fi
