name: Mutual gate (partner-ci)

# Mirrors a PR's `ci` conclusion onto its paired PR as `partner-ci`.
# Combined with branch protection requiring `partner-ci`, this means
# NEITHER PR can merge until BOTH sides' `ci` is green — no split-brain.

on:
  check_run:
    types: [completed]

permissions:
  checks: write
  pull-requests: read
  contents: read

jobs:
  mirror:
    if: github.event.check_run.name == 'ci'
    runs-on: ubuntu-latest
    steps:
      - name: Mirror ci status to paired PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const check = context.payload.check_run;

            // Find the PR whose head is this SHA
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner, repo, commit_sha: check.head_sha,
            });
            const sourcePR = prs.find(p => p.head.sha === check.head_sha && p.state === 'open');
            if (!sourcePR) {
              core.info(`No open PR has HEAD ${check.head_sha} — nothing to mirror`);
              return;
            }

            // Look for `<!-- paired-pr: N -->` in the body first, then comments
            const marker = /<!-- paired-pr: (\d+) -->/;
            let m = sourcePR.body?.match(marker);
            let pairedNum = m ? parseInt(m[1], 10) : null;
            if (!pairedNum) {
              const { data: comments } = await github.rest.issues.listComments({
                owner, repo, issue_number: sourcePR.number, per_page: 100,
              });
              for (const c of comments) {
                const cm = c.body?.match(marker);
                if (cm) { pairedNum = parseInt(cm[1], 10); break; }
              }
            }
            if (!pairedNum) {
              core.info(`PR #${sourcePR.number} has no paired-pr marker — skipping`);
              return;
            }

            // Get the paired PR's HEAD SHA
            const { data: paired } = await github.rest.pulls.get({
              owner, repo, pull_number: pairedNum,
            });

            // Mirror the ci conclusion as partner-ci onto the paired PR's HEAD
            await github.rest.checks.create({
              owner, repo,
              name: 'partner-ci',
              head_sha: paired.head.sha,
              status: 'completed',
              conclusion: check.conclusion,
              output: {
                title: `Paired PR #${sourcePR.number}: ci ${check.conclusion}`,
                summary: `Mirrored from [ci on PR #${sourcePR.number}](${check.html_url}).`,
              },
            });
            core.notice(`Mirrored ci=${check.conclusion} onto PR #${pairedNum} as partner-ci`);
